# Typecheck and unit tests on every push. The parser and billing maths are pure
# functions and exactly the kind of logic that regresses silently. A push to main
# that passes those then builds the SPA and deploys it to Cloudflare.
name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # tsconfig excludes supabase/functions, and `supabase functions deploy`
      # does not typecheck either, so until this step the Edge Functions were
      # checked by nothing. Deno sees errors tsc structurally cannot: it caught a
      # narrowing bug that tsc had no view of, because the files are not in its
      # program at all.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=none because these run on Deno, not Node: resolving
      # against the repo's node_modules would typecheck them against the wrong
      # runtime's types and trip Deno's minimum-dependency-age policy on
      # devDependencies they never import.
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository variables, not secrets: Vite inlines every VITE_ var into
          # the bundle, so masking them in the log would only give false comfort.
          # They must be set, or the build ships a Supabase client that reports a
          # config error to every visitor.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional. Absent, the preferences screen shows the raw /start command
          # instead of a t.me deep link, which still works.
          VITE_TELEGRAM_BOT: ${{ vars.VITE_TELEGRAM_BOT }}
      # A missing repository variable does not fail the build, it changes what
      # gets built: supabase.ts sets configError, main.tsx renders "Not
      # configured" instead of <App/>, and Rollup then tree-shakes the entire
      # application out of the bundle. The build succeeds, the deploy is green,
      # and every visitor gets an error page. Two strings from opposite ends of
      # the app are cheaper than discovering that from a screenshot.
      - name: Refuse to deploy an empty bundle
        run: |
          for marker in billing_statements 'Continue with Google'; do
            grep -rqF "$marker" dist/web/assets/*.js \
              || { echo "::error::built bundle has no '$marker' -- is a VITE_ variable unset?"; exit 1; }
          done
      # Cloudflare's official action. It installs its own wrangler, so the
      # devDependency here only serves local `npm run deploy`.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # Migrations reach the database through the Supabase GitHub integration, but
  # Edge Functions do not: without this they stay whatever was last pushed by
  # hand. A deploy script could not prevent that, because running it was
  # optional. verify_jwt per function comes from supabase/config.toml, so this
  # deploys the whole directory in one command.
  deploy-functions:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref wvtbstticnactealupph
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
